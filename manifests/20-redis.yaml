apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: airs-gw
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - { containerPort: 6379, name: redis }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: airs-gw
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
