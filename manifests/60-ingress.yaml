# ------------------------------------------------------------------
# Ingress for the AI Gateway and MCP Gateway with Basic Auth.
# The `basic-auth` secret is generated by deploy.sh from AIGW_USER +
# AIGW_PASS in .env (htpasswd + bcrypt).  Every request must include
# an "Authorization: Basic <base64>" header.
# ------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aigw-ingress
  namespace: airs-gw
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/auth-type:     basic
    nginx.ingress.kubernetes.io/auth-secret:   basic-auth
    nginx.ingress.kubernetes.io/auth-realm:    "AIGW - authentication required"
spec:
  ingressClassName: nginx
  rules:
    - host: aigw.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portkey-gateway
                port: { number: 8787 }
    - host: mcp-aigw.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portkey-gateway
                port: { number: 8788 }
