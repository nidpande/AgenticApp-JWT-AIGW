apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: keycloak
type: Opaque
stringData:
  # Keycloak master realm admin (login at http://keycloak.local/)
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: kc-admin-poc-CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  # This secret is consumed later by agent-api (Phase 1) via a cross-namespace
  # SecretRef mirror. It holds the client_secret of the aigw-chat OIDC client
  # so that agent-api can perform the code -> token exchange.
  name: aigw-chat-oauth
  namespace: keycloak
type: Opaque
stringData:
  OIDC_CLIENT_ID: aigw-chat
  # Must match the "secret" field of the aigw-chat client in the realm import JSON
  OIDC_CLIENT_SECRET: aigw-chat-client-secret-CHANGE-ME
