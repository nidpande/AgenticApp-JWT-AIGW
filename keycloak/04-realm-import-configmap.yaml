# aigw realm bootstrap - imported by Keycloak on every startup via --import-realm.
#
# Creates:
#   * confidential client `aigw-chat`  (BFF client, used by agent-api)
#   * bearer-only client  `aigw-api`   (represents AIGW as resource server)
#   * client scope        `aigw-api`   (audience + groups mappers)
#   * groups              gemini-users, admins
#   * users               alice (gemini-users), bob (no groups), admin (admins)
#
# Any user password in this file is POC-only. Rotate for prod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: keycloak
data:
  aigw-realm.json: |
    {
      "realm": "aigw",
      "enabled": true,
      "accessTokenLifespan": 3600,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "clients": [
        {
          "clientId": "aigw-chat",
          "name": "AIGW Chat BFF",
          "description": "Confidential OIDC client used by agent-api Backend-For-Frontend",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "aigw-chat-client-secret-CHANGE-ME",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": false,
          "redirectUris": [
            "http://chat.local/api/auth/callback",
            "http://chat.local/*"
          ],
          "webOrigins": [
            "http://chat.local"
          ],
          "attributes": {
            "post.logout.redirect.uris": "http://chat.local/*",
            "pkce.code.challenge.method": "S256"
          },
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "email",
            "roles"
          ],
          "optionalClientScopes": [
            "aigw-api",
            "offline_access",
            "phone",
            "microprofile-jwt"
          ]
        },
        {
          "clientId": "aigw-api",
          "name": "AIGW Resource Server",
          "description": "Bearer-only client representing the Portkey AIGW - JWTs are validated against this audience",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "bearerOnly": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false
        }
      ],
      "clientScopes": [
        {
          "name": "aigw-api",
          "description": "Grants access to AIGW LLM proxy; adds aud=aigw-api and groups claim",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true",
            "consent.screen.text": "Access the AIGW LLM proxy on your behalf"
          },
          "protocolMappers": [
            {
              "name": "audience-aigw-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "aigw-api",
                "included.custom.audience": "",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "groups-claim",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "groups": [
        { "name": "gemini-users" },
        { "name": "admins" }
      ],
      "roles": {
        "realm": [
          { "name": "chat.completions", "description": "May call AIGW /v1/chat/completions" }
        ]
      },
      "users": [
        {
          "username": "alice",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Alice",
          "lastName": "Example",
          "email": "alice@example.local",
          "credentials": [
            { "type": "password", "value": "alice", "temporary": false }
          ],
          "groups": [ "gemini-users" ],
          "realmRoles": [ "chat.completions" ]
        },
        {
          "username": "bob",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Bob",
          "lastName": "NoAccess",
          "email": "bob@example.local",
          "credentials": [
            { "type": "password", "value": "bob", "temporary": false }
          ]
        },
        {
          "username": "kcadmin",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Kc",
          "lastName": "Admin",
          "email": "kcadmin@example.local",
          "credentials": [
            { "type": "password", "value": "kcadmin", "temporary": false }
          ],
          "groups": [ "admins", "gemini-users" ],
          "realmRoles": [ "chat.completions" ]
        }
      ],
      "requiredActions": []
    }
