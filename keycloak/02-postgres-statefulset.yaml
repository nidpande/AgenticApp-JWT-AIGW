---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
  namespace: keycloak
  labels: { app: keycloak-db }
spec:
  clusterIP: None            # headless — required for StatefulSet stable network id
  selector: { app: keycloak-db }
  ports:
  - name: pg
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  serviceName: keycloak-db
  replicas: 1
  selector: { matchLabels: { app: keycloak-db } }
  template:
    metadata: { labels: { app: keycloak-db } }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef: { name: keycloak-db }
        env:
        # Postgres 16 stores data under $PGDATA - keep the default but on a persistent mount
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        ports:
        - { name: pg, containerPort: 5432 }
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
          initialDelaySeconds: 30
          periodSeconds: 20
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: standard        # kind default (rancher.io/local-path)
      resources:
        requests: { storage: 5Gi }
