# kind cluster for Prisma AIRS AIGW Hybrid POC
# 1 control-plane + 2 workers; ports 80/443 mapped to host for ingress-nginx.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: airs-poc
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
